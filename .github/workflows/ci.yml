name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      - name: AgentHub focused test suite
        run: npm run test:agenthub
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links

  build:
    name: Build
    runs-on: macos-latest
    # Build exercises the native node-pty rebuild; allowed to fail without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  backend-smoke:
    name: Real Backend 0.7.3K Smoke
    runs-on: macos-latest
    steps:
      - name: Checkout Desktop
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Checkout Backend 0.7.3K
        uses: actions/checkout@v4
        with:
          repository: 704986409/AgentHub
          path: backend
          ref: d3ec66605d469e5328caff2317a8605a69419b7c
          fetch-depth: 0
      - name: Fetch Backend tags
        working-directory: backend
        run: git fetch --tags origin
      - name: Install Backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build Backend
        working-directory: backend
        run: npm run build
      - name: Install Desktop dependencies
        run: npm ci
      - name: Run Real Backend 0.7.3K Smoke
        env:
          AGENTHUB_REAL_BACKEND_SMOKE: '1'
          AGENTHUB_BACKEND_ROOT: ${{ github.workspace }}/backend
        run: npm run test:agenthub:smoke
